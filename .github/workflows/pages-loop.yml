# Publica chromeos-loop (loop station) en GitHub Pages para instalarla como app en el Chromebook.
# Solo se ejecuta a mano (Actions -> "Loop app -> GitHub Pages" -> Run workflow)
# y requiere Settings -> Pages -> Source: GitHub Actions.
name: Loop app -> GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-loop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: chromeos-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chromeos-loop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chromeos-loop/dist
      - id: deployment
        uses: actions/deploy-pages@v4
