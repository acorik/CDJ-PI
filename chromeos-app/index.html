<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>CDJ-PI IRL</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage">
      <!-- escritorio/juego capturado, fondo a pantalla completa -->
      <video id="desktopVideo" autoplay muted playsinline></video>

      <!-- cámara local (webcam, Continuity Camera, Elgato si aparece como UVC) -->
      <video id="camVideo" autoplay muted playsinline hidden></video>

      <!-- cámara de iPhone vía VDO.Ninja: iframe, no se puede leer con canvas,
           por eso todo el compositing final se hace auto-capturando esta
           misma pestaña (ver src/main.ts) en vez de dibujar en un <canvas> -->
      <iframe
        id="vdoFrame"
        hidden
        allow="camera; microphone; autoplay; display-capture"
        referrerpolicy="no-referrer"
      ></iframe>

      <div id="chatBox" hidden></div>
    </div>

    <form id="settings">
      <h1>CDJ-PI IRL</h1>

      <label>
        WHIP endpoint
        <input id="whipUrl" type="url" placeholder="https://tu-pi.example.com/whip/live" required />
      </label>
      <label>
        Usuario (publish)
        <input id="whipUser" type="text" autocomplete="off" />
      </label>
      <label>
        Contraseña (publish)
        <input id="whipPass" type="password" autocomplete="off" />
      </label>

      <label>
        Fuente de cámara
        <select id="cameraSource">
          <option value="none">Ninguna</option>
          <option value="webcam" selected>Webcam local / Elgato / Continuity</option>
          <option value="vdoninja">iPhone vía VDO.Ninja</option>
        </select>
      </label>

      <label id="webcamDeviceRow">
        Dispositivo
        <select id="webcamDevice"></select>
      </label>

      <label id="vdoRow" hidden>
        ID de sala VDO.Ninja
        <input id="vdoStreamId" type="text" placeholder="se genera solo si lo dejas vacío" autocomplete="off" />
      </label>
      <p id="vdoLink" hidden class="hint"></p>

      <label>
        Canal de Twitch para chat (opcional)
        <input id="chatChannel" type="text" placeholder="tu_canal" autocomplete="off" />
      </label>

      <button id="startBtn" type="submit">Empezar</button>
      <button id="stopBtn" type="button" disabled>Parar</button>
    </form>

    <div id="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">parado</span>
      <span id="bitrate"></span>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
